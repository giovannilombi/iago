name: CI

# macOS runners count 10x against the GitHub Free minutes quota:
# run only on pull requests touching code, or manually.
on:
  pull_request:
    paths:
      - "Packages/**"
      - "App/**"
      - "scripts/check-network-apis.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: No unexpected network APIs
        run: scripts/check-network-apis.sh
      - name: Test packages
        run: scripts/test-packages.sh
