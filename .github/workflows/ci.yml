name: CI

# On every pull request and every push to main (the repository is public, so GitHub Actions minutes are free), and
# by hand with `gh workflow run ci.yml --ref <branch>`. The same tests run on the developer's Mac before every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: No unexpected network APIs
        run: scripts/check-network-apis.sh
      - name: Test packages
        run: scripts/test-packages.sh
