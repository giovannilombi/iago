# Documentation site (VitePress) on GitHub Pages, from the official VitePress workflow.
# GitHub Free has no Pages for private repositories: while giovannilombi/iago is private the jobs are skipped, and the
# site goes live by itself on the first push to main after the repository becomes public (ADR-0068).
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "App/Resources/Guide/**"
      - "Design/iago-logo.svg"
      - "Design/iago-menubar-colors.svg"
      - "scripts/docs-sync-guide.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v4
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
