# Documentation site (VitePress) on GitHub Pages, from the official VitePress workflow (ADR-0068).
# - Push to main: build and deploy, only once giovannilombi/iago is public (GitHub Free has no Pages for private
#   repositories); while it is private the job is skipped and uses no minutes.
# - Manually (`gh workflow run deploy.yml --ref <branch>`), when the owner asks for it: builds the site (broken links
#   fail the build). Before every PR the same build runs on the developer's Mac (`npm run docs:build`).
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "App/Resources/Guide/**"
      - "Design/iago-logo.svg"
      - "Design/iago-menubar-colors.svg"
      - "scripts/docs-sync-guide.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v4
        if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
        with:
          path: docs/.vitepress/dist

  deploy:
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
