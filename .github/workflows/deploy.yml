# Documentation site (VitePress) on GitHub Pages, from the official VitePress workflow (ADR-0068).
# - Pull requests: the site is built (broken links fail the build), on Ubuntu, so docs and guide stay publishable.
# - Push to main: build and deploy. GitHub Free has no Pages for private repositories, so while giovannilombi/iago is
#   private the deploy is skipped; the site goes live by itself on the first push after the repository becomes public.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "App/Resources/Guide/**"
      - "Design/iago-logo.svg"
      - "Design/iago-menubar-colors.svg"
      - "scripts/docs-sync-guide.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "docs/**"
      - "App/Resources/Guide/**"
      - "scripts/docs-sync-guide.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v4
        if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
        with:
          path: docs/.vitepress/dist

  deploy:
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
