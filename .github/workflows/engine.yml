name: Engine

# The MLX adapter needs Metal shaders, which `swift test` cannot build (ADR-0048): a full app build with MLX, on the
# pull requests that touch the engine (free minutes, the repository is public) and by hand; locally:
# scripts/test-engine.sh.
on:
  pull_request:
    paths:
      - "App/Sources/Engine/**"
      - "Packages/IAGOEngine/**"
      - "project.yml"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Build with MLX
        run: CODE_SIGNING_ALLOWED=NO scripts/test-engine.sh
